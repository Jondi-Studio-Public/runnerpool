# This repo's own gate, on GitHub-hosted runners so forks and outside contributors get CI with no
# setup. It is safe for fork pull requests: triggered by pull_request (never pull_request_target),
# read-only token, no secrets. `scripts/gate.sh` runs the same checks locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The bash that runs on the Macs and the PC, and the PowerShell parse. shellcheck and pwsh are
  # preinstalled on ubuntu-latest. Warnings and errors fail; shellcheck's info notes don't.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/gate.sh shell

  # ci_shard.py and the steal queue decide which tests every downstream run executes, so a bug here
  # silently drops tests rather than failing them.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: scripts/gate.sh python

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The release script is fetched by version tag from the actionlint repo.
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - run: ./actionlint -color

  ci-ok:
    if: always()
    needs: [shell, python, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Passes only when every needed job succeeded.
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] != "success"}
          if bad:
              sys.exit("not green: %s" % bad)
          print("all needed jobs passed")'
