<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>runnerpool</title>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --card-2: #f8f9fb;
  --text: #1c2129;
  --muted: #667085;
  --line: #e3e6ec;
  --accent: #2f6fed;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefd;
  --green: #1a7f4b;   --green-bg: #dff5e8;
  --amber: #8f5a00;   --amber-bg: #fdf0d2;
  --grey: #5b6472;    --grey-bg: #e9ebf0;
  --red: #b42318;     --red-bg: #fde4e1;
  --track: #d5d9e1;
  --switch-off: #c3c9d4;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151a;
    --card: #1a1e25;
    --card-2: #20252d;
    --text: #e6e9ef;
    --muted: #97a0af;
    --line: #2b313b;
    --accent: #6b9bff;
    --accent-ink: #0d1626;
    --accent-soft: #1f2d4a;
    --green: #5fd394;   --green-bg: #14301f;
    --amber: #f2be5a;   --amber-bg: #3a2c0c;
    --grey: #a4adbb;    --grey-bg: #2a2f38;
    --red: #ff8f84;     --red-bg: #431a17;
    --track: #2e3541;
    --switch-off: #48505e;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
header.top h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
header.top .stamp { color: var(--muted); font-size: 13px; }
header.top .spacer { flex: 1; }
h3 { font-size: 12px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }

button {
  font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; min-height: 34px;
  display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.hl { border-color: var(--accent); background: var(--accent-soft); }
a { color: var(--accent); }

.spin {
  width: 13px; height: 13px; border-radius: 50%; flex: none;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } .pill.busy::before { animation: none; } }

.banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; background: var(--red-bg); color: var(--red); border: 1px solid transparent; overflow-wrap: anywhere; }
.banner.warn { background: var(--amber-bg); color: var(--amber); }
.banner[hidden] { display: none; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr)); align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.card-head h3 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.card-head .sub { color: var(--muted); font-size: 13px; flex-basis: 100%; overflow-wrap: anywhere; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--grey-bg); color: var(--grey); white-space: nowrap; }
.pill { box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 22%, transparent); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.busy:not(.plain)::before { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.pill.online { background: var(--green-bg); color: var(--green); }
.pill.busy { background: var(--amber-bg); color: var(--amber); }
.pill.offline { background: var(--grey-bg); color: var(--grey); }
.pill.error { background: var(--red-bg); color: var(--red); }
.pill.plain::before { display: none; }
.why { color: var(--muted); font-size: 12px; }
.stale { opacity: .55; }

.notice { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--amber-bg); color: var(--amber); overflow-wrap: anywhere; }
.notice.err { background: var(--red-bg); color: var(--red); }
.notice .when { opacity: .85; }

.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 16px; margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); }
.spec { min-width: 0; margin: 0; }
.spec dt { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 1px; }
.spec dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.spec.wide { grid-column: 1 / -1; }
.spec .small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.spec .small.warn { color: var(--amber); } .spec .small.bad { color: var(--red); }
.bar { height: 6px; border-radius: 4px; background: var(--track); margin-top: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar > i.warn { background: #e0a020; }
.bar > i.bad { background: #d9483b; }
.bar > i.good { background: #2ea36a; }

.controls { margin-top: 16px; padding-top: 6px; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.row .lbl { flex: 1 1 160px; min-width: 0; }
.row .lbl b { font-weight: 500; display: block; }
.row .lbl small { color: var(--muted); font-size: 12px; display: block; overflow-wrap: anywhere; }
.row .ctl { display: flex; align-items: center; gap: 10px; }
select { font: inherit; color: var(--text); background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; min-height: 30px; }
select:disabled { opacity: .5; }

/* toggle switch drawn from a real checkbox */
input.switch {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
  width: 42px; height: 24px; border-radius: 999px; background: var(--switch-off);
  position: relative; transition: background .15s;
}
input.switch::before {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
}
input.switch:checked { background: var(--accent); }
input.switch:checked::before { transform: translateX(18px); }
input.switch:disabled { opacity: .45; cursor: not-allowed; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.actions .upd { display: inline-flex; align-items: center; gap: 6px; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }

details.log { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); }
details.log summary { cursor: pointer; padding: 8px 12px; font-weight: 500; overflow-wrap: anywhere; }
details.log summary .tag { font-size: 12px; font-weight: 600; margin-left: 6px; }
details.log summary .tag.ok { color: var(--green); }
details.log summary .tag.fail { color: var(--red); }
details.log .body { padding: 0 12px 12px; }
details.log pre { margin: 0; font: 12px/1.5 var(--mono); max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
details.log .lnk { display: inline-block; margin-top: 8px; }

.foot { margin-top: 14px; display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; }
.foot .spacer { flex: 1; }
.foot button { font-size: 12px; min-height: 30px; padding: 4px 10px; }
.hint { font-size: 12px; color: var(--muted); flex-basis: 100%; }
.gh { margin-top: 12px; font-size: 12px; color: var(--muted); }
.gh .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 2px 0; }
.gh .r span.n { color: var(--text); font-weight: 500; }
.actionerr { margin-top: 12px; }

.repo { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; box-shadow: var(--shadow); min-width: 0; }
.repo .rh { display: flex; gap: 8px; align-items: center; padding: 10px 14px; flex-wrap: wrap; overflow-wrap: anywhere; }
.repo .rh b { font-weight: 600; }
.tscroll { overflow-x: auto; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; min-width: 440px; }
th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.labels { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 14px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
.tiles:empty { display: none; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; min-width: 0; }
.tile .tl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tile .tv { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.tile .tv.good { color: var(--green); } .tile .tv.warn { color: var(--amber); } .tile .tv.bad { color: var(--red); }
.tile .ts { color: var(--muted); font-size: 12px; }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 38px; margin-top: 6px; }
.spark.mini { height: 22px; gap: 2px; margin-top: 4px; max-width: 90px; }
.spark i { flex: 1; background: var(--accent); border-radius: 2px; min-height: 3px; }
td .labels { font-size: 12px; color: var(--muted); }
td.mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
#runs table { min-width: 560px; }
#ci table { min-width: 520px; }
#ci td.repo-name a, #ci td.repo-name span { font-weight: 600; }
#ci .prs { display: flex; flex-direction: column; gap: 4px; }
#ci .pr { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; overflow-wrap: anywhere; }
.gh { font-size: 13px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
.gh h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.rn { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--line); }
.rn .nm { flex: 1 1 170px; min-width: 0; overflow-wrap: anywhere; }
.rn .nm b { font-weight: 500; }
.rn .nm small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.rn .lim { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.rn label.f { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.rn input.num { font: inherit; width: 5.2em; color: var(--text); background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 7px; min-height: 30px; }
.rn input.num.custom { border-color: var(--accent); }
.rn input.num:disabled { opacity: .5; }
.rn button { font-size: 12px; min-height: 28px; padding: 2px 9px; box-shadow: none; }
.rn .saved { flex-basis: 100%; font-size: 12px; color: var(--amber); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.rn .saved.ok { color: var(--green); }
.rn .saved.bad { color: var(--red); }
.rn .saved .why { overflow-wrap: anywhere; }
.rn .act { flex-basis: 100%; font-size: 12px; color: var(--amber); overflow-wrap: anywhere; }
.rn .act a, .admins .act a, .rdetail .act a { color: inherit; text-decoration: underline; }
.rn .act.unk, .admins .act.unk, .rdetail .act.unk { color: var(--muted); }
.admins .act { flex-basis: 100%; font-size: 12px; color: var(--amber); overflow-wrap: anywhere; }
.rdetail .act { overflow-wrap: anywhere; color: var(--amber); }
.admins { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.admins .pill { font-size: 11px; padding: 1px 7px; }
.limnote { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
/* fleet filter: search box plus status chips that carry the counts */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 14px; }
.toolbar[hidden] { display: none; }
.toolbar input[type=search] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; min-height: 34px; flex: 1 1 200px; min-width: 0; max-width: 340px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border-radius: 999px; min-height: 30px; padding: 2px 11px; font-size: 13px; box-shadow: none; }
.chips button b { font-weight: 600; }
.chips button[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
/* sortable column headers */
th button.sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; text-transform: inherit; letter-spacing: inherit; font: inherit; color: inherit; }
th button.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
th button.sort:hover, th[aria-sort=ascending] button.sort, th[aria-sort=descending] button.sort { color: var(--text); }
th button.sort i { font-style: normal; font-size: 9px; opacity: .35; }
th[aria-sort=ascending] button.sort i, th[aria-sort=descending] button.sort i { opacity: 1; }
.repo .rh .cnt { color: var(--muted); font-weight: 400; font-size: 12px; }
/* empty and error states */
.state { text-align: center; padding: 22px 16px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.state svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
.state.err { color: var(--red); }
.state h4 { margin: 6px 0 2px; font-size: 14px; color: var(--text); }
.state p { margin: 0 auto; max-width: 60ch; font-size: 13px; overflow-wrap: anywhere; }
.state button { margin-top: 10px; }
/* runner detail panel */
.rdetail { flex-basis: 100%; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px 10px; }
.rdetail .specs { margin-top: 8px; padding-top: 10px; border-top: 0; }
.rdetail h5 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.rdetail .jl { display: flex; gap: 4px 10px; align-items: center; flex-wrap: wrap; padding: 3px 0; font-size: 13px; overflow-wrap: anywhere; }
.rdetail .jl .labels { color: var(--muted); }
.hidden-note { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>runnerpool</h1>
    <span class="stamp" id="stamp">Loading…</span>
    <span class="spacer"></span>
    <button id="refreshAll" type="button">Refresh all</button>
    <form method="post" action="/logout" style="margin:0"><button type="submit">Sign out</button></form>
  </header>
  <div id="banner" class="banner" hidden role="alert"></div>
  <main>
    <div id="stats" class="tiles"></div>
    <div id="fleet" class="toolbar" role="search" hidden>
      <input id="q" type="search" placeholder="Filter runners by name, repo or label" aria-label="Filter runners">
      <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
    </div>
    <div id="fleetEmpty"></div>
    <div id="devices" class="grid"></div>
    <h2 id="otherH" hidden>Other runners</h2>
    <div id="other"></div>
    <h2 id="ciH" hidden>CI</h2>
    <div id="ci"></div>
    <h2 id="runsH" hidden>Recent runs</h2>
    <div id="runs"></div>
    <h2 id="jobsH" hidden>Runner history</h2>
    <div id="jobs"></div>
  </main>
</div>

    if (S.runsErr) box.appendChild(h("div", { class: "notice", text: "Runs not refreshed: " + S.runsErr }));

    box.appendChild(h("div", { class: "hint", style: "margin-top:4px", text: "Latest " + R.runs.length + " runs; stats cover the last " + k.runs + " runs across the repos. Updated " + fmtTime(R.at) + "." }));
  }

  /* ---------- runner history: who ran what, and how fast ---------- */
  function trendBars(xs) {
    var max = Math.max.apply(null, xs.concat([1]));
    var sp = h("span", { class: "spark mini", role: "img", "aria-label": "Recent durations, oldest first: " + xs.map(fmtDur).join(", ") });
    xs.forEach(function (x) {
      var i = h("i", { title: fmtDur(x) });

  }
  function renderJobs() {
    var box = document.getElementById("jobs"), hd = document.getElementById("jobsH");
    var J = S.jobs;

            h("div", { class: "labels", text: x.n + " run" + (x.n === 1 ? "" : "s") + " · last " + fmtDur(x.last_s) }),

    }
    // newest jobs

    box.appendChild(J.jobs.length ? sortableTable("jobs", [
      { t: "Result", v: function (j) { return j.conclusion; } }, { t: "Job", v: function (j) { return j.name; } },
      { t: "Repo", v: function (j) { return shortRepo(j.repo); } }, { t: "Runner", v: function (j) { return j.runner; } },
      { t: "Took", v: function (j) { return j.duration_s; } }, { t: "Finished", v: function (j) { return Date.parse(j.completed); } }], J.jobs.slice(0, 40), function (j) {

  }

  /* ---------- CI: the ci-ok check per repo ---------- */

  tick();
