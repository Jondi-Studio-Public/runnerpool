# Where `runner build-local` reads the installer's secrets from in 1Password (`op read`).
# These are only op:// references, never the secrets. CI_APP_ID and CI_APP_PRIVATE_KEY are the CI GitHub App's
# id and PEM key (1Password item "CI GitHub App", fields app_id and private_key): when both read, the installers
# carry them and RUNNER_PAT is not needed. Edit them to match your vault and
# items, or override one run with OP_RUNNER_PAT=op://... / OP_TS_AUTHKEY=op://... in the
# environment. Leave a value empty to be asked for that secret instead.
CI_APP_ID=op://Example-Vault/CI GitHub App/app_id
CI_APP_PRIVATE_KEY=op://Example-Vault/CI GitHub App/private_key
RUNNER_PAT=op://Example-Vault/RUNNER_PAT/token
TS_AUTHKEY=op://Example-Vault/Tailscale ci-mac/credential
